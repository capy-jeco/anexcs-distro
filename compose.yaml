services:
  postgres:
    image: postgres:18
    container_name: anexcs-distro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anexcs_distro_central
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  anexcs.distro.api:
    image: anexcs.distro.api
    build:
      context: .
      dockerfile: Anexcs.Distro.Api/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  postgres_data: